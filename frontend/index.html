/* ========================================================
   Supply Chain Risk Prediction System - Main Stylesheet
   Swizosoft (OPC) Private Limited
   ======================================================== */

@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #0a0d14;
  --bg2:     #111520;
  --bg3:     #161b2a;
  --bg4:     #1c2236;
  --accent:  #00e5a0;
  --accent2: #3b82f6;
  --accent3: #f59e0b;
  --accent4: #ef4444;
  --text:    #e8edf8;
  --text2:   #8892a4;
  --text3:   #4a5568;
  --border:  #1e2a42;
  --border2: #2a3a5a;
  --green:   #00e5a0;
  --red:     #ef4444;
  --yellow:  #f59e0b;
  --blue:    #3b82f6;
  --sidebar-w: 220px;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  font-size: 14px;
  line-height: 1.5;
}

h1, h2, h3, h4 { font-family: 'Syne', sans-serif; }
.mono { font-family: 'DM Mono', monospace; }

/* ── LAYOUT ─────────────────────────────────────────────── */
.layout { display: flex; min-height: 100vh; }

/* ── SIDEBAR ─────────────────────────────────────────────── */
.sidebar {
  width: var(--sidebar-w);
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
  overflow-y: auto;
}

.logo {
  padding: 20px 16px 16px;
  border-bottom: 1px solid var(--border);
}
.logo-badge {
  background: var(--accent);
  color: #000;
  font-family: 'Syne', sans-serif;
  font-size: 9px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 3px;
  letter-spacing: 1px;
  display: inline-block;
  margin-bottom: 8px;
}
.logo h2 { font-size: 14px; font-weight: 600; color: var(--text); }
.logo p  { font-size: 11px; color: var(--text2); margin-top: 2px; }

.nav { flex: 1; padding: 12px 8px; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text2);
  transition: all .15s;
  margin-bottom: 2px;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  font-family: 'DM Sans', sans-serif;
}
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active {
  background: rgba(0,229,160,.1);
  color: var(--accent);
  border-left: 2px solid var(--accent);
}
.nav-icon { width: 16px; text-align: center; font-size: 14px; opacity: .8; }
.nav-item.active .nav-icon { opacity: 1; }

.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
}
.status-line { font-size: 12px; color: var(--text2); display: flex; align-items: center; gap: 6px; }
.status-sub { font-size: 10px; color: var(--text3); margin-top: 3px; }
.status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--green);
  display: inline-block;
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ── MAIN ───────────────────────────────────────────────── */
.main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; }

.topbar {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
}
.topbar h1 { font-size: 15px; font-weight: 600; }
.topbar-right { display: flex; align-items: center; gap: 10px; }

.content { padding: 20px 24px; flex: 1; }

/* ── CARDS ──────────────────────────────────────────────── */
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
}
.card-inner {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
}

/* ── GRIDS ──────────────────────────────────────────────── */
.grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 18px; }
.grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin-bottom: 18px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }

/* ── METRIC CARDS ────────────────────────────────────────── */
.metric-label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; }
.metric-val   { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 700; margin: 4px 0 2px; }
.metric-change{ font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text2); }
.change-bad { color: var(--red); }
.change-good{ color: var(--green); }

/* ── TAGS / BADGES ───────────────────────────────────────── */
.tag {
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 4px;
  font-family: 'DM Mono', monospace;
}
.tag-green  { background: rgba(0,229,160,.15); color: var(--green); }
.tag-yellow { background: rgba(245,158,11,.15);color: var(--yellow); }
.tag-red    { background: rgba(239,68,68,.15); color: var(--red); }
.tag-blue   { background: rgba(59,130,246,.15);color: var(--blue); }

/* ── RISK BADGES ─────────────────────────────────────────── */
.risk {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-family: 'DM Mono', monospace;
  font-weight: 500;
  letter-spacing: .3px;
}
.risk-high, .risk-critical { background: rgba(239,68,68,.2); color: #ff7070; }
.risk-med  { background: rgba(245,158,11,.2); color: #fbbf24; }
.risk-low  { background: rgba(0,229,160,.2);  color: #00e5a0; }

/* ── PROGRESS BAR ───────────────────────────────────────── */
.bar-wrap { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; transition: width .5s ease; }

/* ── BUTTONS ─────────────────────────────────────────────── */
.btn {
  padding: 9px 18px;
  border-radius: 7px;
  border: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  font-family: 'DM Sans', sans-serif;
  transition: all .15s;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-primary { background: var(--accent); color: #000; }
.btn-primary:hover { opacity: .85; transform: translateY(-1px); }
.btn-danger  { background: var(--red); color: #fff; }
.btn-danger:hover { opacity: .85; }
.btn-outline {
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--text2);
}
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }
.btn-sm { padding: 5px 12px; font-size: 11px; border-radius: 5px; }

/* ── FORMS ───────────────────────────────────────────────── */
.form-group { margin-bottom: 12px; }
.form-label {
  display: block;
  font-size: 11px;
  color: var(--text2);
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: .4px;
}
input, select, textarea {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 6px;
  color: var(--text);
  padding: 8px 12px;
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  transition: border-color .15s;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
}
select option { background: var(--bg3); }

/* ── TABLES ──────────────────────────────────────────────── */
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th {
  text-align: left;
  padding: 8px 10px;
  color: var(--text2);
  font-weight: 500;
  font-size: 11px;
  border-bottom: 1px solid var(--border);
  text-transform: uppercase;
  letter-spacing: .5px;
}
td {
  padding: 9px 10px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,.02); }

/* ── ALERTS ──────────────────────────────────────────────── */
.alert {
  padding: 10px 14px;
  border-radius: 7px;
  margin-bottom: 8px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 12px;

.alert-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
.alert-red    { background: rgba(239,68,68,.1);  border-left: 3px solid var(--red); }
.alert-yellow { background: rgba(245,158,11,.1); border-left: 3px solid var(--yellow); }
.alert-green  { background: rgba(0,229,160,.1);  border-left: 3px solid var(--green); }
.alert-blue   { background: rgba(59,130,246,.1); border-left: 3px solid var(--blue); }
.alert strong { color: var(--text); font-size: 12px; display: block; margin-bottom: 2px; }
.alert span   { color: var(--text2); font-size: 11px; }

/* ── SECTION HEADER ─────────────────────────────────────── */
.sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  flex-wrap: wrap;
  gap: 8px;
}
.sec-title { font-size: 13px; font-weight: 600; color: var(--text); font-family: 'Syne', sans-serif; }
.sec-sub   { font-size: 11px; color: var(--text2); margin-top: 1px; }

/* ── RECOMMENDATION CARD ─────────────────────────────────── */
.rec-card {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  margin-bottom: 10px;

  align-items: flex-start;
}
.rec-icon {

.rec-title { font-size: 13px; font-weight: 500; margin-bottom: 4px; color: var(--text); }
.rec-desc  { font-size: 11px; color: var(--text2); line-height: 1.5; }
.rec-actions { margin-top: 10px; display: flex; gap: 8px; }

/* ── UPLOAD ZONE ─────────────────────────────────────────── */
.upload-zone {
  border: 2px dashed var(--border2);
  border-radius: 10px;
  padding: 24px;
  text-align: center;
  cursor: pointer;
  transition: border-color .2s, background .2s;
  margin-bottom: 12px;
}
.upload-zone:hover { border-color: var(--accent); background: rgba(0,229,160,.03); }
.upload-zone-icon { font-size: 30px; margin-bottom: 8px; }
.upload-zone-title { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
.upload-zone-sub   { font-size: 11px; color: var(--text2); }

/* ── TIMELINE ────────────────────────────────────────────── */
.timeline-item { display: flex; gap: 12px; margin-bottom: 16px; }
.tl-left { display: flex; flex-direction: column; align-items: center; }
.tl-dot  { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.tl-line { width: 1px; flex: 1; background: var(--border); margin: 4px 0; }
.tl-content .tl-title { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
.tl-content .tl-sub   { font-size: 11px; color: var(--text2); }

/* ── UPLOAD LOG ─────────────────────────────────────────── */
.upload-log {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--text2);
  min-height: 100px;
  max-height: 200px;
  overflow-y: auto;
  white-space: pre-wrap;
  line-height: 1.7;
}

/* ── SCROLLBAR ───────────────────────────────────────────── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

/* ── LOADING ─────────────────────────────────────────────── */
.loading {
  text-align: center;
  padding: 40px;
  color: var(--text2);
  font-size: 13px;
}
.spinner {
  width: 24px; height: 24px;
  border: 2px solid var(--border2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── MISC ───────────────────────────────────────────────── */
canvas { border-radius: 6px; }

.mb-4  { margin-bottom: 4px; }
.mb-8  { margin-bottom: 8px; }
.mb-12 { margin-bottom: 12px; }
.mb-16 { margin-bottom: 16px; }
.mb-20 { margin-bottom: 20px; }

.text-green  { color: var(--green); }
.text-red    { color: var(--red); }
.text-yellow { color: var(--yellow); }
.text-blue   { color: var(--blue); }
.text-muted  { color: var(--text2); }

.d-flex { display: flex; }
.align-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-8  { gap: 8px; }
.gap-12 { gap: 12px; }
.gap-16 { gap: 16px; }
.flex-1 { flex: 1; }

/* ── RESPONSIVE ─────────────────────────────────────────── */
@media (max-width: 900px) {
  .sidebar { width: 60px; }
  .sidebar .logo h2, .sidebar .logo p, .sidebar .logo-badge,
  .sidebar .nav-item span:not(.nav-icon), .sidebar .sidebar-footer p { display: none; }
  .main { margin-left: 60px; }
  .grid-4 { grid-template-columns: repeat(2,1fr); }
  .grid-3 { grid-template-columns: repeat(2,1fr); }
  .grid-2 { grid-template-columns: 1fr; }
}
</style>

const API_BASE = 'http://localhost:8000/api';

const API = {
  async get(path) {
    try {
      const res = await fetch(API_BASE + path);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    } catch (e) {
      console.warn('API GET failed, using demo data:', path, e.message);
      return null;
    }
  },
  async post(path, body) {
    try {
      const res = await fetch(API_BASE + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    } catch (e) {
      console.warn('API POST failed, using local simulation:', path, e.message);
      return null;
    }
  }
};

/**
 * Chart Utilities - Chart.js wrappers
 */

const CHART_DEFAULTS = {
  responsive: true,
  maintainAspectRatio: false,
  plugins: { legend: { display: false } },
};

const GRID_COLOR = '#1e2a42';
const TICK_COLOR = '#8892a4';
const TICK_FONT  = { size: 10, family: "'DM Mono', monospace" };

function axisDefaults(extra = {}) {
  return {
    ticks: { color: TICK_COLOR, font: TICK_FONT },
    grid:  { color: GRID_COLOR },
    ...extra
  };
}

function makeDelayChart(canvasId) {
  const ctx = document.getElementById(canvasId);
  if (!ctx) return null;
  const days = Array.from({ length: 14 }, (_, i) => {
    const d = new Date(); d.setDate(d.getDate() + i);

function runPrediction() {
  const origin   = document.getElementById('p-origin').value;
  const dest     = document.getElementById('p-dest').value;
  const carrier  = document.getElementById('p-carrier').value;
  const cargo    = document.getElementById('p-cargo').value;
  const weight   = parseInt(document.getElementById('p-weight').value) || 12500;
  const dateStr  = document.getElementById('p-date').value;
  const month    = dateStr ? new Date(dateStr).getMonth() + 1 : 5;

  // Simulate XGBoost prediction logic
  let base = Math.random() * 35 + 10;
  if (cargo === 'Perishables')   base += 18;
  if (weight > 20000)            base += 12;
  if ([6,7,8,9].includes(month)) base += 15;  // typhoon season
  if (origin === 'Mumbai' && dest === 'Los Angeles') base += 18;
  if (carrier === 'COSCO')       base += 8;

  const prob     = Math.min(95, Math.round(base));
  const delayDays = prob > 50 ? (prob / 100 * 5).toFixed(1) : (prob / 100 * 2).toFixed(1);

  const factors = [
    { name: 'Weather / Season',  val: Math.round(15 + Math.random() * 20) },
    { name: 'Route Congestion',  val: Math.round(12 + Math.random() * 18) },
    { name: 'Port Efficiency',   val: Math.round(10 + Math.random() * 15) },
    { name: 'Carrier History',   val: Math.round(8  + Math.random() * 12) },
    { name: 'Cargo Type',        val: cargo === 'Perishables' ? 18 : Math.round(5 + Math.random() * 10) },
    { name: 'Weight Factor',     val: Math.min(15, Math.round(weight / 50000 * 20)) },
  ];
  const total = factors.reduce((s, f) => s + f.val, 0);

  document.getElementById('pred-waiting').style.display = 'none';
  document.getElementById('pred-output').style.display  = 'block';
  document.getElementById('pred-delay-val').textContent = prob + '%';
  document.getElementById('pred-days-val').textContent  = delayDays + 'd';

  const rlEl = document.getElementById('pred-risk-level');
  const rl   = prob >= 60 ? 'HIGH' : prob >= 30 ? 'MEDIUM' : 'LOW';
  rlEl.textContent = rl;
  rlEl.style.color = prob >= 60 ? 'var(--red)' : prob >= 30 ? 'var(--yellow)' : 'var(--green)';

  document.getElementById('shap-bars').innerHTML = factors.map(f => {
    const pct = Math.round(f.val / total * 100);
    return `<div class="mb-8">
      <div class="d-flex justify-between mb-4" style="font-size:11px"><span>${f.name}</span><span class="mono text-yellow">${pct}%</span></div>
      <div class="bar-wrap"><div class="bar-fill" style="width:${pct}%;background:var(--yellow)"></div></div>
    </div>`;
  }).join('');

  const alertEl = document.getElementById('pred-alert');
  if (prob >= 60) {
    alertEl.className = 'alert alert-red';
    alertEl.innerHTML = '<span class="alert-icon" style="color:var(--red)">⚠</span><div><strong>High Risk Detected</strong><span>Consider alternate routing or early dispatch to mitigate delay risk.</span></div>';
  } else if (prob >= 30) {
    alertEl.className = 'alert alert-yellow';
    alertEl.innerHTML = '<span class="alert-icon" style="color:var(--yellow)">◎</span><div><strong>Moderate Risk</strong><span>Monitor closely and have contingency plan ready.</span></div>';
  } else {
    alertEl.className = 'alert alert-green';
    alertEl.innerHTML = '<span class="alert-icon" style="color:var(--green)">✓</span><div><strong>Low Risk</strong><span>Shipment is expected to arrive on schedule.</span></div>';
  }
}

function checkInventory() {
  const stock  = parseInt(document.getElementById('inv-stock').value)  || 0;
  const demand = parseFloat(document.getElementById('inv-demand').value) || 1;
  const lead   = parseInt(document.getElementById('inv-lead').value)   || 7;
  const sku    = document.getElementById('inv-sku').value || 'SKU-XXXX';
  const days   = Math.floor(stock / demand);
  const reorderQty = Math.round(demand * 30);
  const safetyStock = Math.round(demand * lead * 1.5);

  let cls, html;
  if (days <= 7) {
    cls  = 'alert alert-red';
    html = `<strong>CRITICAL — ${days} days until stockout for ${sku}</strong><span>Emergency reorder needed. Suggested qty: ${reorderQty.toLocaleString()} units. Safety stock: ${safetyStock.toLocaleString()} units.</span>`;
  } else if (days <= 21) {
    cls  = 'alert alert-yellow';
    html = `<strong>WARNING — ${days} days of stock remaining for ${sku}</strong><span>Plan reorder within 7 days. Suggested qty: ${reorderQty.toLocaleString()} units.</span>`;
  } else {
    cls  = 'alert alert-green';
    html = `<strong>OK — ${days} days of coverage for ${sku}</strong><span>Stock levels adequate. Next review in 14 days.</span>`;
  }
  const r = document.getElementById('inv-result');
  r.className = cls; r.innerHTML = html; r.style.display = 'flex'; r.style.gap = '10px';
}

}

function simulateUpload(type) {
  const log  = document.getElementById('upload-log');
  const dots = ['dot-ml','dot-risk','dot-dash'];
  const info = { shipments:['shipment_data.csv','247 shipment records'], inventory:['inventory.xlsx','1,842 SKU records'], suppliers:['supplier_performance.csv','84 supplier records'] };
  const [file, records] = info[type];
  dots.forEach(id => { const d=document.getElementById(id); if(d) d.style.background='var(--border2)'; });
  log.textContent = `> Loading ${file}...`;
  const steps = [
    [400,  `> Parsing ${records}...`],
    [800,  `> Checking for missing values...`],
    [1200, `> Encoding categorical variables...`],
    [1600, `> Feature engineering complete ✓`],
    [2000, `> Running XGBoost inference pipeline...`],
    [2400, `> Calculating composite risk scores...`],
    [2800, `> Generating alerts and recommendations...`],
    [3200, `> Updating dashboard metrics...`],
    [3600, `> ✅ Pipeline complete! ${records} processed successfully.`],
  ];
  let dotIdx = 0;
  steps.forEach(([t, msg], i) => {
    setTimeout(() => {
      log.textContent += '\n' + msg;
      log.scrollTop = log.scrollHeight;
      if (i >= 3 && dotIdx < dots.length) {
        const d = document.getElementById(dots[dotIdx]);
        if (d) d.style.background = 'var(--green)';
        dotIdx++;
      }
    }, t);
  });
}

/**
 * App.js - Main application entry point
 * Handles page routing, live clock, and global utilities
 */

const PAGE_TITLES = {
  dashboard: 'Dashboard Overview',
  predict:   'Risk Prediction Engine',
  inventory: 'Inventory Risk Monitor',
  suppliers: 'Supplier Scorecard',
  shipments: 'Shipment Tracker',
  analytics: 'Analytics & Forecasting',
  recommendations: 'AI Recommendations',
  upload:    'Data Upload & Processing'
};

const PAGE_RENDERERS = {
  dashboard:       renderDashboard,
  predict:         renderPredict,
  inventory:       renderInventory,
  suppliers:       renderSuppliers,
  shipments:       renderShipments,
  analytics:       renderAnalytics,
  recommendations: renderRecommendations,
  upload:          renderUpload,
};

let currentPage = 'dashboard';

function gotoPage(id, btn) {
  currentPage = id;
  document.getElementById('page-title').textContent = PAGE_TITLES[id] || id;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const root = document.getElementById('page-root');
  root.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';
  setTimeout(() => {
    if (PAGE_RENDERERS[id]) PAGE_RENDERERS[id](root);
  }, 80);
}

function refreshData() {
  const btn = document.querySelector('.topbar-right .btn-outline');
  if (btn) { btn.textContent = '↻ Refreshing...'; }
  setTimeout(() => {
    if (btn) btn.textContent = '↻ Refresh';
    gotoPage(currentPage, document.querySelector('.nav-item.active'));
  }, 800);
}

// Live clock
function updateClock() {
  const el = document.getElementById('live-time');
  if (el) el.textContent = new Date().toLocaleTimeString();
}
setInterval(updateClock, 1000);
updateClock();

// Boot
window.addEventListener('DOMContentLoaded', () => {
  gotoPage('dashboard', document.querySelector('.nav-item.active'));
});

// Helpers
function riskClass(level) {
  const m = { HIGH:'risk-high', CRITICAL:'risk-critical', MEDIUM:'risk-med', LOW:'risk-low' };
  return 'risk ' + (m[level] || 'risk-low');
}

function statusClass(status) {
  const m = { DELAYED:'risk-high', AT_RISK:'risk-med', ON_TIME:'risk-low', DELIVERED:'risk-low' };
  return 'risk ' + (m[status] || 'risk-low');
}

function barColor(pct) {
  if (pct >= 60) return 'var(--red)';
  if (pct >= 30) return 'var(--yellow)';
  return 'var(--green)';
}

function reorder(skuId) {
  const po = 'PO-' + Math.floor(Math.random() * 9000 + 1000);
  alert(`✅ Reorder request created!\n\nPurchase Order: ${po}\nSKU: ${skuId}\nStatus: Pending Approval\n\nCheck the Inventory page for details.`);
}
